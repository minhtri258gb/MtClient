<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager · 2 cấp</title>
    <!-- Font Awesome 6 (miễn phí) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f7fc;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 28px 30px 40px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sub-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .actions button {
            background: #eef2f6;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .actions button:hover {
            background: #dce3ec;
        }
        .actions button.primary {
            background: #1e293b;
            color: white;
        }
        .actions button.primary:hover {
            background: #0f172a;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        /* task item */
        .task-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 10px 14px 10px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #e9edf2;
            transition: 0.15s;
            cursor: grab;
        }
        .task-item.dragging {
            opacity: 0.3;
            cursor: grabbing;
        }
        .task-item.done {
            opacity: 0.7;
        }
        .task-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .task-row .left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }
        .task-row .left .name {
            font-weight: 500;
            font-size: 15px;
            word-break: break-word;
        }
        .task-row .left .expired {
            font-size: 13px;
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 30px;
            color: #1e293b;
            white-space: nowrap;
        }
        .task-row .tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .task-row .tags span {
            background: #e9edf2;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 12px;
            color: #1e293b;
        }
        .task-row .icons i {
            font-size: 18px;
            color: #475569;
            width: 24px;
            text-align: center;
        }
        .task-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }
        .task-actions button {
            background: transparent;
            border: none;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #64748b;
            transition: 0.15s;
        }
        .task-actions button:hover {
            background: #eef2f6;
            color: #0f172a;
        }
        .task-actions .del {
            color: #b91c1c;
        }
        .task-actions .del:hover {
            background: #fee2e2;
        }
        .child-list {
            margin-left: 36px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-left: 2px dashed #dce3ec;
            padding-left: 16px;
        }
        .child-list .task-item {
            background: #fafcff;
            border-color: #dce3ec;
        }
        .expand-toggle {
            background: transparent;
            border: none;
            font-size: 14px;
            cursor: pointer;
            width: 24px;
            color: #64748b;
        }
        .priority-check {
            accent-color: #1e293b;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .quick-edit {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
            padding: 8px 6px 4px 6px;
            background: #f8fafc;
            border-radius: 20px;
            align-items: center;
        }
        .quick-edit input, .quick-edit select {
            border: 1px solid #d1d9e6;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 13px;
            background: white;
        }
        .quick-edit input[type="text"] {
            min-width: 120px;
        }
        .quick-edit input[type="date"] {
            width: 140px;
        }
        .quick-edit button {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 13px;
            cursor: pointer;
        }
        .status-badge {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 500;
        }
        .status-green { background: #dcfce7; color: #166534; }
        .status-yellow { background: #fef9c3; color: #854d0e; }
        .status-red { background: #fee2e2; color: #991b1b; }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
        }
        .footer {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .footer button {
            background: none;
            border: none;
            color: #1e293b;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="sub-bar">
        <h1><i class="fas fa-list-check" style="color:#1e293b;"></i> Task Manager</h1>
        <div class="actions">
            <button class="primary" id="addRootBtn"><i class="fas fa-plus"></i> Thêm task</button>
            <button id="backupBtn"><i class="fas fa-download"></i> Backup</button>
            <button id="importBtn"><i class="fas fa-upload"></i> Import</button>
            <input type="file" id="fileInput" accept=".json" style="display:none">
        </div>
    </div>
    <div id="taskListContainer" class="task-list"></div>
    <div class="footer">
        <span><i class="far fa-circle"></i> Kéo thả cùng cấp · Double-click tên để sửa nhanh</span>
        <span><i class="fas fa-trash-alt"></i> Xóa task con xóa luôn</span>
    </div>
</div>
<script>
    (function(){
        // ----- STATE -----
        let tasks = [];          // root tasks
        let nextId = 1;

        // ----- DOM refs -----
        const container = document.getElementById('taskListContainer');
        const addRootBtn = document.getElementById('addRootBtn');
        const backupBtn = document.getElementById('backupBtn');
        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');

        // ----- helpers -----
        function generateId() { return nextId++; }

        function loadFromStorage() {
            const raw = localStorage.getItem('taskManagerData');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    tasks = data.tasks || [];
                    nextId = data.nextId || 1;
                } catch(e) { tasks = []; nextId = 1; }
            } else {
                // mẫu khởi tạo
                tasks = [];
                nextId = 1;
            }
        }

        function saveToStorage() {
            localStorage.setItem('taskManagerData', JSON.stringify({ tasks, nextId }));
        }

        // ----- filter: ẩn task done từ 2 ngày trước (xóa luôn) -----
        function cleanOldDoneTasks(taskList) {
            const now = new Date();
            now.setHours(0,0,0,0);
            const twoDaysAgo = new Date(now);
            twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
            // xóa root task nếu done và hoàn thành >= 2 ngày trước (dựa vào expired? thực tế không có completedAt, ta dùng ngày hôm nay - 2)
            // nhưng không có completedAt, ta giả định: nếu done && expired < twoDaysAgo => xóa
            // Nếu không có expired thì dùng current day?
            // Ta sẽ xóa nếu done và (expired && expired < twoDaysAgo) (nếu expired không có thì không xóa)
            // Cũng xóa nếu done và expired < twoDaysAgo (hoặc nếu không có expired, thì không xóa)
            // Nhưng "hoàn thành ngày hôm qua" hiển thị, hoàn thành từ 2 ngày trước ẩn -> xóa.
            // Do không có completedAt, ta xóa nếu done và expired < twoDaysAgo.
            // Nếu không expired, giữ lại (không xóa)
            // Áp dụng cho root và child
            function filterTasks(list) {
                return list.filter(task => {
                    // kiểm tra xóa task cha
                    let shouldKeep = true;
                    if (task.done) {
                        if (task.expired) {
                            const expDate = new Date(task.expired);
                            expDate.setHours(0,0,0,0);
                            if (expDate < twoDaysAgo) {
                                shouldKeep = false;
                            }
                        }
                    }
                    if (!shouldKeep) return false;

                    // lọc con
                    if (task.list && task.list.length) {
                        task.list = filterTasks(task.list);
                    }
                    // nếu task cha done và tất cả con done => tự động check done (cập nhật sau)
                    return true;
                });
            }
            return filterTasks(taskList);
        }

        // ----- tự động check task cha nếu tất cả con done (độ sâu 2) -----
        function autoCheckParent(tasksList) {
            tasksList.forEach(task => {
                if (task.list && task.list.length) {
                    const allDone = task.list.every(sub => sub.done === true);
                    if (allDone) {
                        task.done = true;
                    } else {
                        task.done = false;   // nếu có con chưa done, cha undone
                    }
                }
            });
        }

        // ----- render -----
        function render() {
            // 1. Làm sạch các task done từ 2 ngày trước (xóa)
            tasks = cleanOldDoneTasks(tasks);
            // 2. Auto check cha
            autoCheckParent(tasks);
            // 3. Lưu
            saveToStorage();
            // 4. Render
            container.innerHTML = '';
            if (!tasks.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list" style="font-size:40px; opacity:0.3;"></i><p>Chưa có task nào. Thêm task mới!</p></div>';
                return;
            }
            tasks.forEach((task, index) => {
                const el = createTaskElement(task, index, true);
                container.appendChild(el);
            });
            // kéo thả (cùng cấp)
            enableDragDrop(container, true);
        }

        // ----- tạo DOM cho task (đệ quy) -----
        function createTaskElement(task, index, isRoot) {
            const div = document.createElement('div');
            div.className = 'task-item' + (task.done ? ' done' : '');
            div.dataset.id = task.id;
            div.dataset.index = index;
            div.dataset.isRoot = isRoot ? 'true' : 'false';

            // màu sắc theo hạn
            let statusClass = '';
            if (!task.done && task.expired) {
                const now = new Date();
                now.setHours(0,0,0,0);
                const exp = new Date(task.expired);
                exp.setHours(0,0,0,0);
                if (exp < now) statusClass = 'status-red';
                else if (exp.getTime() === now.getTime()) statusClass = 'status-yellow';
                else statusClass = 'status-green';
            } else if (!task.done) {
                statusClass = 'status-green';
            }

            // row chính
            const row = document.createElement('div');
            row.className = 'task-row';

            // checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'priority-check';
            checkbox.checked = task.done || false;
            checkbox.addEventListener('change', (e) => {
                task.done = e.target.checked;
                // nếu task có con: không tự động check con, chỉ check cha
                // nếu task là con, cập nhật lại cha
                render();
            });

            // expand nếu có con
            const expandBtn = document.createElement('button');
            expandBtn.className = 'expand-toggle';
            const hasChildren = task.list && task.list.length > 0;
            let expanded = true; // mặc định mở
            if (hasChildren) {
                expandBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
                expandBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const childContainer = div.querySelector('.child-list');
                    if (childContainer) {
                        const isHidden = childContainer.style.display === 'none';
                        childContainer.style.display = isHidden ? 'flex' : 'none';
                        expandBtn.innerHTML = isHidden ? '<i class="fas fa-chevron-down"></i>' : '<i class="fas fa-chevron-right"></i>';
                    }
                });
            } else {
                expandBtn.innerHTML = '<i class="fas fa-chevron-right" style="opacity:0.3;"></i>';
                expandBtn.style.pointerEvents = 'none';
            }

            // icon
            const iconSpan = document.createElement('span');
            iconSpan.className = 'icons';
            if (task.icon) {
                iconSpan.innerHTML = `<i class="${task.icon}"></i>`;
            } else {
                iconSpan.innerHTML = `<i class="fas fa-tag" style="opacity:0.3;"></i>`;
            }

            // tên
            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = task.name || 'Không tên';
            // double-click chỉnh sửa tên + hạn + tag
            nameSpan.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                openQuickEditor(task, div);
            });

            // expired
            const expiredSpan = document.createElement('span');
            expiredSpan.className = 'expired';
            expiredSpan.textContent = task.expired ? task.expired : '';

            // tags
            const tagsDiv = document.createElement('div');
            tagsDiv.className = 'tags';
            if (task.tags && task.tags.length) {
                task.tags.forEach(t => {
                    const tag = document.createElement('span');
                    tag.textContent = t;
                    tagsDiv.appendChild(tag);
                });
            }

            // status badge
            const badge = document.createElement('span');
            badge.className = `status-badge ${statusClass}`;
            if (!task.done && task.expired) {
                const now = new Date(); now.setHours(0,0,0,0);
                const exp = new Date(task.expired); exp.setHours(0,0,0,0);
                if (exp < now) badge.textContent = 'Trễ';
                else if (exp.getTime() === now.getTime()) badge.textContent = 'Hôm nay';
                else badge.textContent = 'Còn hạn';
            } else if (task.done) {
                badge.textContent = '✅ Done';
                badge.className = 'status-badge status-green';
            } else {
                badge.textContent = '🟢';
            }

            // actions
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'task-actions';

            // thêm task con (click phải)
            const addChildBtn = document.createElement('button');
            addChildBtn.innerHTML = '<i class="fas fa-plus-circle"></i>';
            addChildBtn.title = 'Thêm task con (click phải)';
            addChildBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!task.list) task.list = [];
                const newChild = createDefaultTask();
                newChild.id = generateId();
                task.list.push(newChild);
                render();
            });
            // thêm context menu thêm con (click phải)
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (!task.list) task.list = [];
                const newChild = createDefaultTask();
                newChild.id = generateId();
                task.list.push(newChild);
                render();
            });

            // xóa
            const delBtn = document.createElement('button');
            delBtn.className = 'del';
            delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Xóa task này?')) {
                    if (isRoot) {
                        tasks.splice(index, 1);
                    } else {
                        // tìm cha để xóa
                        const parent = findParentTask(tasks, task.id);
                        if (parent) {
                            const idx = parent.list.findIndex(t => t.id === task.id);
                            if (idx > -1) parent.list.splice(idx, 1);
                        }
                    }
                    render();
                }
            });

            // ưu tiên (nút lên đầu / xuống cuối)
            const upBtn = document.createElement('button');
            upBtn.innerHTML = '<i class="fas fa-arrow-up"></i>';
            upBtn.title = 'Ưu tiên lên đầu';
            upBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isRoot) {
                    moveTaskToTop(tasks, index);
                } else {
                    const parent = findParentTask(tasks, task.id);
                    if (parent) {
                        const idx = parent.list.findIndex(t => t.id === task.id);
                        if (idx > 0) {
                            const [removed] = parent.list.splice(idx, 1);
                            parent.list.unshift(removed);
                            render();
                        }
                    }
                }
            });
            const downBtn = document.createElement('button');
            downBtn.innerHTML = '<i class="fas fa-arrow-down"></i>';
            downBtn.title = 'Ưu tiên xuống cuối';
            downBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isRoot) {
                    moveTaskToBottom(tasks, index);
                } else {
                    const parent = findParentTask(tasks, task.id);
                    if (parent) {
                        const idx = parent.list.findIndex(t => t.id === task.id);
                        if (idx < parent.list.length - 1) {
                            const [removed] = parent.list.splice(idx, 1);
                            parent.list.push(removed);
                            render();
                        }
                    }
                }
            });

            actionsDiv.appendChild(addChildBtn);
            actionsDiv.appendChild(upBtn);
            actionsDiv.appendChild(downBtn);
            actionsDiv.appendChild(delBtn);

            // gộp row
            const leftDiv = document.createElement('div');
            leftDiv.className = 'left';
            leftDiv.appendChild(iconSpan);
            leftDiv.appendChild(nameSpan);
            leftDiv.appendChild(expiredSpan);
            leftDiv.appendChild(tagsDiv);
            leftDiv.appendChild(badge);

            row.appendChild(checkbox);
            row.appendChild(expandBtn);
            row.appendChild(leftDiv);
            row.appendChild(actionsDiv);
            div.appendChild(row);

            // child list
            if (hasChildren) {
                const childContainer = document.createElement('div');
                childContainer.className = 'child-list';
                childContainer.style.display = 'flex';
                task.list.forEach((child, idx) => {
                    const childEl = createTaskElement(child, idx, false);
                    childContainer.appendChild(childEl);
                });
                div.appendChild(childContainer);
                // enable drag drop cho child list
                enableDragDrop(childContainer, false);
            }

            return div;
        }

        // ----- quick editor (double-click) -----
        function openQuickEditor(task, div) {
            // xóa editor cũ nếu có
            const old = div.querySelector('.quick-edit');
            if (old) old.remove();

            const editor = document.createElement('div');
            editor.className = 'quick-edit';
            editor.innerHTML = `
                <input type="text" id="qeName" value="${task.name || ''}" placeholder="Tên task">
                <input type="date" id="qeExpired" value="${task.expired || ''}">
                <input type="text" id="qeTags" value="${task.tags ? task.tags.join(',') : ''}" placeholder="tag1,tag2">
                <input type="text" id="qeIcon" value="${task.icon || ''}" placeholder="fa-solid fa-star">
                <button id="qeSave">Lưu</button>
                <button id="qeCancel">Hủy</button>
            `;
            div.appendChild(editor);

            const nameInput = editor.querySelector('#qeName');
            const expiredInput = editor.querySelector('#qeExpired');
            const tagsInput = editor.querySelector('#qeTags');
            const iconInput = editor.querySelector('#qeIcon');
            const saveBtn = editor.querySelector('#qeSave');
            const cancelBtn = editor.querySelector('#qeCancel');

            saveBtn.addEventListener('click', () => {
                task.name = nameInput.value.trim() || 'Không tên';
                task.expired = expiredInput.value || undefined;
                task.tags = tagsInput.value.split(',').map(s => s.trim()).filter(Boolean);
                task.icon = iconInput.value.trim() || undefined;
                render();
            });
            cancelBtn.addEventListener('click', () => {
                editor.remove();
            });
        }

        // ----- tạo task mặc định -----
        function createDefaultTask() {
            return {
                id: generateId(),
                name: 'Task mới',
                expired: '',
                done: false,
                tags: [],
                icon: '',
                list: []
            };
        }

        // ----- thêm root -----
        function addRootTask(priorityTop = true) {
            const newTask = createDefaultTask();
            if (priorityTop) {
                tasks.unshift(newTask);
            } else {
                tasks.push(newTask);
            }
            render();
        }

        // ----- di chuyển task lên đầu / cuối -----
        function moveTaskToTop(arr, idx) {
            if (idx > 0) {
                const [item] = arr.splice(idx, 1);
                arr.unshift(item);
                render();
            }
        }
        function moveTaskToBottom(arr, idx) {
            if (idx < arr.length - 1) {
                const [item] = arr.splice(idx, 1);
                arr.push(item);
                render();
            }
        }

        // ----- tìm parent task (cho child) -----
        function findParentTask(taskList, childId) {
            for (let t of taskList) {
                if (t.list && t.list.some(c => c.id === childId)) {
                    return t;
                }
            }
            return null;
        }

        // ----- Kéo thả (cùng cấp) -----
        function enableDragDrop(containerEl, isRoot) {
            let dragItem = null;
            containerEl.addEventListener('dragstart', (e) => {
                const item = e.target.closest('.task-item');
                if (!item) return;
                dragItem = item;
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', item.dataset.id);
            });
            containerEl.addEventListener('dragend', (e) => {
                const item = e.target.closest('.task-item');
                if (item) item.classList.remove('dragging');
            });
            containerEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                const target = e.target.closest('.task-item');
                if (!target || target === dragItem) return;
                const rect = target.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                if (e.clientY < midY) {
                    containerEl.insertBefore(dragItem, target);
                } else {
                    containerEl.insertBefore(dragItem, target.nextSibling);
                }
            });
            containerEl.addEventListener('drop', (e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData('text/plain');
                if (!id) return;
                // cập nhật lại mảng
                const items = [...containerEl.querySelectorAll('.task-item')];
                const newOrder = items.map(el => parseInt(el.dataset.id));
                // cập nhật tasks
                if (isRoot) {
                    const newRoots = [];
                    const map = new Map();
                    tasks.forEach(t => map.set(t.id, t));
                    newOrder.forEach(id => {
                        if (map.has(id)) newRoots.push(map.get(id));
                    });
                    tasks = newRoots;
                } else {
                    // cập nhật con
                    const parent = findParentTask(tasks, parseInt(id));
                    if (parent) {
                        const map = new Map();
                        parent.list.forEach(t => map.set(t.id, t));
                        const newList = [];
                        newOrder.forEach(id => {
                            if (map.has(id)) newList.push(map.get(id));
                        });
                        parent.list = newList;
                    }
                }
                render();
            });
        }

        // ----- backup / import -----
        function backup() {
            const blob = new Blob([JSON.stringify({ tasks, nextId }, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `task_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.tasks && Array.isArray(data.tasks)) {
                        tasks = data.tasks;
                        nextId = data.nextId || 1;
                        render();
                    } else {
                        alert('File không hợp lệ');
                    }
                } catch(err) {
                    alert('Lỗi đọc file');
                }
            };
            reader.readAsText(file);
        }

        // ----- init -----
        loadFromStorage();
        // Đảm bảo mỗi task có list
        tasks.forEach(t => { if (!t.list) t.list = []; });
        render();

        // ----- events -----
        addRootBtn.addEventListener('click', () => {
            // mặc định ưu tiên trên cùng (checkbox ưu tiên)
            addRootTask(true);
        });

        backupBtn.addEventListener('click', backup);
        importBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                importData(e.target.files[0]);
                fileInput.value = '';
            }
        });

        // context menu cho root (thêm con) - thêm sự kiện trên container
        container.addEventListener('contextmenu', (e) => {
            // chỉ xử lý nếu click vào task-item
            const item = e.target.closest('.task-item');
            if (!item) {
                e.preventDefault();
                // thêm root
                addRootTask(true);
            }
        });

        // shortcut: thêm task con bằng click phải đã xử lý trong task item
    })();
</script>
</body>
</html>
