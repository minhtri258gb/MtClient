<!DOCTYPE html>
<html lang="vi">
<head>

	<meta charset="UTF-8" />
	<title>Xem log realtime</title>

	<style>
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #1e1e1e;
			color: #ddd;
			margin: 0;
			padding: 20px;
		}
		.bar {
			display: flex;
			gap: 8px;
			margin-bottom: 12px;
		}
		input {
			flex: 1;
			padding: 8px 10px;
			border-radius: 6px;
			border: 1px solid #444;
			background: #2b2b2b;
			color: #fff;
			font-family: monospace;
		}
		button {
			padding: 8px 16px;
			border-radius: 6px;
			border: none;
			background: #3b82f6;
			color: #fff;
			cursor: pointer;
			font-weight: 600;
		}
		button:hover { background: #2563eb; }
		button.stop { background: #ef4444; }
		button.stop:hover { background: #dc2626; }
		#status {
			margin-bottom: 10px;
			font-size: 13px;
			color: #999;
		}
		#status.ok { color: #4ade80; }
		#status.err { color: #f87171; }
		#log {
			background: #111;
			border: 1px solid #333;
			border-radius: 6px;
			height: 70vh;
			overflow-y: auto;
			padding: 10px;
			font-family: "Cascadia Code", Consolas, monospace;
			font-size: 13px;
			white-space: pre-wrap;
			word-break: break-all;
		}
		.line { padding: 1px 0; border-bottom: 1px solid #1c1c1c; }
	</style>
</head>
<body>

	<div class="bar">
		<input id="this.e_pathInput" type="text" placeholder="Đường dẫn file log, vd: D:/log.txt" value="D:/log.txt" />
		<button onclick="mt.btnConnect()">Xem file</button>
		<button onclick="mt.btnUnwatch()" class="stop">Dừng</button>
	</div>

	<div id="status">Chưa kết nối</div>
	<div id="log"></div>

	<script type="module">
		var mt = {
			e_pathInput: null,
			e_statusEl: null,
			e_logEl: null,
			m_ws: null,

			init() {

				// Bind Global
				globalThis.mt = this;

				this.e_pathInput = document.getElementById("this.e_pathInput");
				this.e_statusEl = document.getElementById("status");
				this.e_logEl = document.getElementById("log");

				this.e_pathInput.addEventListener("keydown", (e) => {
					if (e.key === "Enter")
						mt.btnConnect();
				});

				this.connect();
			},
			setStatus(text, kind) {
				this.e_statusEl.textContent = text;
				this.e_statusEl.className = kind || "";
			},
			appendLine(text) {
				const atBottom =
					this.e_logEl.scrollTop + this.e_logEl.clientHeight >= this.e_logEl.scrollHeight - 20;
				const div = document.createElement("div");
				div.className = "line";
				div.textContent = text;
				this.e_logEl.appendChild(div);
				if (atBottom) this.e_logEl.scrollTop = this.e_logEl.scrollHeight;
			},
			connect() {
				this.m_ws = new WebSocket(`ws://${location.host}/logs`);

				this.m_ws.onopen = () => this.setStatus("Đã kết nối tới server", "ok");

				this.m_ws.onmessage = (event) => {
					const msg = JSON.parse(event.data);

					if (msg.type === "watching") {
						this.setStatus(`Đang theo dõi: ${msg.path}`, "ok");
						this.e_logEl.innerHTML = "";
					} else if (msg.type === "data") {
						for (const line of msg.lines) this.appendLine(line);
					} else if (msg.type === "unwatched") {
						this.setStatus("Đã dừng theo dõi", "");
					} else if (msg.type === "error") {
						this.setStatus(`Lỗi: ${msg.message}`, "err");
					}
				};

				this.m_ws.onclose = () => {
					this.setStatus("Mất kết nối, đang thử lại...", "err");
					setTimeout(() => this.connect(), 1500);
				};

				this.m_ws.onerror = () => this.m_ws.close();
			},

			btnConnect() {
				console.log('Connecting...');
				const path = this.e_pathInput.value.trim();
				if (!path) return;
				if (!this.m_ws || this.m_ws.readyState !== WebSocket.OPEN) {
					this.setStatus("Chưa kết nối tới server", "err");
					return;
				}
				this.m_ws.send(JSON.stringify({ type: "watch", path }));
			},
			btnUnwatch() {
				console.log('Stopping...');
				if (!this.m_ws || this.m_ws.readyState !== WebSocket.OPEN)
					return;
				this.m_ws.send(JSON.stringify({ type: "unwatch" }));
			},
		};
		document.addEventListener("DOMContentLoaded", () => mt.init());
	</script>
</body>
</html>
