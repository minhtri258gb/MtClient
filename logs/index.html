<!DOCTYPE html>
<html lang="vi">
<head>

	<title>Log</title>
	<meta charset="UTF-8" />

	<link href="/lib/fontawesome-6.7.2/css/all.min.css" rel="stylesheet" integrity="sha512-..." crossorigin="anonymous" />

	<style>
		* { box-sizing: border-box; }
		body {
			height: 100vh;
			display: flex;
			flex-direction: column;
			font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #1e1e1e;
			color: #ddd;
			margin: 0;
			padding: 20px;
		}
		.bar {
			display: flex;
			gap: 8px;
			margin-bottom: 12px;
		}
		select {
			border-radius: 6px;
			border: 1px solid #444;
			background: #2b2b2b;
			color: #fff;
		}
		input {
			flex: 1;
			padding: 8px 10px;
			border-radius: 6px;
			border: 1px solid #444;
			background: #2b2b2b;
			color: #fff;
			font-family: monospace;
		}
		button {
			padding: 8px 16px;
			border-radius: 6px;
			border: none;
			background: #3b82f6;
			color: #fff;
			cursor: pointer;
			font-weight: 600;
		}
		button:hover { background: #2563eb; }
		button.stop { background: #ef4444; }
		button.stop:hover { background: #dc2626; }
		#status {
			margin-bottom: 10px;
			font-size: 13px;
			color: #999;
		}
		#status.ok { color: #4ade80; }
		#status.err { color: #f87171; }
		#log {
			flex: 1;
			background: #111;
			border: 1px solid #333;
			border-radius: 6px;
			height: 70vh;
			overflow-y: auto;
			padding: 10px;
			font-family: "Cascadia Code", Consolas, monospace;
			font-size: 13px;
			white-space: pre-wrap;
			word-break: break-all;
		}
		.line { padding: 1px 0; border-bottom: 1px solid #1c1c1c; }
	</style>
</head>
<body>

	<div class="bar">
		<select id="list-log" onchange="mt.event.selectLog()"></select>
		<input id="path-input" type="text" placeholder="Đường dẫn file log, vd: D:/log.txt" value="" />
		<button onclick="mt.btnConnect()">
			<i class="fa-regular fa-eye"></i>
			Xem file
		</button>
		<button onclick="mt.btnUnwatch()" class="stop">
			<i class="fa-regular fa-circle-stop"></i>
			Dừng
		</button>
	</div>

	<div id="status">Chưa kết nối</div>
	<div id="log"></div>

	<script type="module">
		import mtApi from '/common/api.js';
		import mtLib from '/common/lib.js';
		import mtShow from '/common/show.js';

		var mt = {
			api: mtApi,
			lib: mtLib,
			show: mtShow,

			h_debug: true,
			e_listLog: null, // Select box list file log
			e_pathInput: null,
			e_statusEl: null,
			e_logEl: null,
			d_path: '', // Đường dẫn folder
			d_list: [], // Danh sách file log
			m_ws: null,
			m_curpath: '',

			event: {
				selectLog() {

					// Ghi filepath
					mt.e_pathInput.value = mt.d_path + '/' + mt.e_listLog.value;
				},
			},

			async init() {
				try {

					// Bind Global
					globalThis.mt = this;

					// Import Library
					// this.lib.component(['TagBox']); // Ko cần đợi | 'Rate'
					await mt.lib.import([
						// 'tabulator', // Datagrid
						// 'tingle', // Popup
						// 'jsonEditor', // Form
						'toastify', // Toast
						// 'sweetalert2', // Alert
					]);

					// Reference
					this.e_listLog = document.getElementById('list-log');
					this.e_pathInput = document.getElementById('path-input');
					this.e_statusEl = document.getElementById('status');
					this.e_logEl = document.getElementById('log');

					this.e_pathInput.addEventListener('keydown', (e) => {
						if (e.key === 'Enter')
							this.btnConnect();
					});

					this.connect();

					await this.load();
				}
				catch (ex) {
					this.show.toast('error', ex.message);
					console.error('[mt.init]', ex);
				}
			},
			async load() {

				let urlParams = new URLSearchParams(window.location.search);
				let folderpath = urlParams.get('path');
				if (folderpath == null)
					return;

				this.d_path = folderpath.replaceAll('\\', '/');

				// Call API - get list log
				let lstLog = await this.api.fileList(this.d_path);

				this.d_list = [];
				for (let file of lstLog) {

					// Add List
					this.d_list.push(file.name);

					// Add SelectBox
					const option = document.createElement('option');
					option.value = file.name;
					option.text = file.name;
					this.e_listLog.appendChild(option);
				}

				// Mặc định chọn file đầu tiên
				if (this.d_list.length > 0)
					this.e_pathInput.value = this.d_path + '/' + this.d_list[0];

				// Log
				mt.h_debug && console.log('[mt.load]', { folderpath, lstLog, listFile: this.d_list });
			},
			setStatus(text, kind) {
				this.e_statusEl.textContent = text;
				this.e_statusEl.className = kind || "";
			},
			appendLine(text) {
				const atBottom = this.e_logEl.scrollTop + this.e_logEl.clientHeight >= this.e_logEl.scrollHeight - 20;
				const div = document.createElement("div");
				div.className = "line";
				div.textContent = text;
				this.e_logEl.appendChild(div);
				if (atBottom) this.e_logEl.scrollTop = this.e_logEl.scrollHeight;
			},
			connect() {
				this.m_ws = new WebSocket(`ws://${location.host}/logs`);

				this.m_ws.onopen = () => this.setStatus('Đã kết nối tới server', 'ok');

				this.m_ws.onmessage = async (event) => {
					const msg = JSON.parse(event.data);

					if (msg.type === 'watching') {
						this.setStatus(`Đang theo dõi: ${msg.path}`, 'ok');
						this.e_logEl.innerHTML = ''; // Reset log

						// Load first content
						let content = await this.api.fileRead(this.m_curpath, 'text');
						let lines = content.split('\n');
						for (let line of lines)
							this.appendLine(line);
					}
					else if (msg.type === 'data') {
						for (const line of msg.lines)
							this.appendLine(line);
					}
					else if (msg.type === 'unwatched') {
						this.setStatus('Đã dừng theo dõi', '');
					}
					else if (msg.type === 'error') {
						this.setStatus(`Lỗi: ${msg.message}`, "err");
					}
				};

				this.m_ws.onclose = () => {
					this.setStatus('Mất kết nối, đang thử lại...', 'err');
					setTimeout(() => this.connect(), 1500);
				};

				this.m_ws.onerror = () => this.m_ws.close();
			},

			async btnConnect() {
				console.log('Connecting...');
				this.m_curpath = this.e_pathInput.value.trim();
				if (!this.m_curpath)
				return;
				if (!this.m_ws || this.m_ws.readyState !== WebSocket.OPEN) {
					this.setStatus('Chưa kết nối tới server', 'err');
					return;
				}

				// Watch by socket
				this.m_ws.send(JSON.stringify({ type: 'watch', path: this.m_curpath }));
			},
			btnUnwatch() {
				console.log('Stopping...');
				if (!this.m_ws || this.m_ws.readyState !== WebSocket.OPEN)
					return;
				this.m_ws.send(JSON.stringify({ type: "unwatch" }));
			},
		};
		document.addEventListener("DOMContentLoaded", () => mt.init());
	</script>
</body>
</html>
