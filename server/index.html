<body style="height:100vh;width:100%;margin:0;padding:0;">

	<div style="height:100%;display:flex;flex-direction:column;">

		<!-- Toolbar -->
		<div style="display:flex;align-items:center;gap:6px;padding:2px 6px;background:#ffffff;flex-wrap:wrap;width:fit-content;">

			<!-- Nút Refresh All -->
			<button onclick="mt.event.btnTopRefreshAll()" style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#1a1a18; color:#ffffff; border:none; border-radius:6px; font-size:14px; cursor:pointer;">
				<i class="fa-solid fa-arrows-rotate" style="font-size:16px;"></i>
				Refresh All
			</button>

			<!-- Nút split: New, Save -->
			<div style="display:flex; border:1px solid #d4d4d0; border-radius:6px; overflow:hidden;">
				<button onclick="mt.event.btnTopNew()" style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#ffffff; border:none; border-right:1px solid #e5e5e2; font-size:14px; cursor:pointer; color:#1a1a18;">
					<i class="fa-solid fa-plus"></i>
					New
				</button>
				<button onclick="mt.event.btnTopSave()" style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#ffffff; border:none; border-right:1px solid #e5e5e2; font-size:14px; cursor:pointer; color:#1a1a18;">
					<i class="fa-regular fa-floppy-disk"></i>
					Save
				</button>
