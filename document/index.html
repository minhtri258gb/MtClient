<!DOCTYPE html>
<html lang="vi">
<head>

	<title>Document</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="/document/favicon.ico" rel="shortcut icon" type="image/png">

	<script src="/lib/jquery/jquery-3.7.1.min.js"></script>

	<link href="/lib/fontawesome-6.7.2/css/all.min.css" rel="stylesheet" integrity="sha512-..." crossorigin="anonymous" />

	<link href="/document/style.css" type="text/css" rel="stylesheet">
</head>
<body style="height:100vh;width:100%;margin:0;">

	<div style="display:flex;height:100%;">

		<!-- Tree -->
		<div style="display:flex;flex-direction:column;height:100%;">

			<!-- Input Search -->
			<div class="ui icon input" style="margin:16px 16px;">
				<input id="document-tree-search" type="text" placeholder="Search...">
				<i class="search icon"></i>
			</div>

			<!-- JSTree -->
			<div id="document-jstree" style="overflow:auto;"></div>

		</div>

		<!-- Main Contain -->
		<div style="height:100%;width:100%;">

			<!-- Toolbar -->
			<div style="display:flex;align-items:center;gap:6px;padding:2px 6px;background:#ffffff;flex-wrap:wrap;width:calc(100% - 12px);">

				<!-- Nút Download -->
				<button onclick="mt.func.exportPDF()" style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:#1a1a18; color:#ffffff; border:none; border-radius:6px; font-size:14px; cursor:pointer;float:right">
					<i class="fa-solid fa-download" style="font-size:16px;"></i>
					Download PDF
				</button>

				<!-- Nút split: New, Save -->
				<div style="display:flex; border:1px solid #d4d4d0; border-radius:6px; overflow:hidden;">
					<button onclick="mt.event.btnTopEdit()" style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#ffffff; border:none; border-right:1px solid #e5e5e2; font-size:14px; cursor:pointer; color:#1a1a18;">
						<i class="fa-solid fa-pen-to-square"></i>
						Edit
					</button>
					<button onclick="mt.event.btnTopSave()" style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#ffffff; border:none; border-right:1px solid #e5e5e2; font-size:14px; cursor:pointer; color:#1a1a18;">
						<i class="fa-regular fa-floppy-disk"></i>
						Save
					</button>
					<button onclick="mt.event.btnTopShare()" style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#ffffff; border:none; border-right:1px solid #e5e5e2; font-size:14px; cursor:pointer; color:#1a1a18;">
						<i class="fa-solid fa-share"></i>
						Share
					</button>
				</div>

				<!-- <div style="width:1px; height:22px; background:#d4d4d0;"></div> -->

				<!-- Nút icon-only -->
				<!-- <button aria-label="Sao chép" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; background:#ffffff; border:1px solid #d4d4d0; border-radius:6px; cursor:pointer; color:#1a1a18;">
					<i class="ti ti-copy" style="font-size:16px;" aria-hidden="true"></i>
				</button> -->

				<!-- <button aria-label="Xóa" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; background:#ffffff; border:1px solid #d4d4d0; border-radius:6px; cursor:pointer; color:#a32d2d;">
					<i class="ti ti-trash" style="font-size:16px;" aria-hidden="true"></i>
				</button> -->

				<!-- <button aria-label="Làm mới" disabled style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; background:#f1efe8; border:1px solid #e5e5e2; border-radius:6px; cursor:not-allowed; color:#b4b2a9;">
					<i class="ti ti-refresh" style="font-size:16px;" aria-hidden="true"></i>
				</button> -->

				<!-- <div style="width:1px; height:22px; background:#d4d4d0;"></div> -->

				<!-- Nút split: Chạy -->
				<!-- <div style="display:flex; border:1px solid #d4d4d0; border-radius:6px; overflow:hidden;">
					<button style="display:flex; align-items:center; gap:6px; padding:6px 12px; background:#ffffff; border:none; border-right:1px solid #e5e5e2; font-size:14px; cursor:pointer; color:#1a1a18;">
						<i class="ti ti-player-play" style="font-size:16px;" aria-hidden="true"></i>
						Chạy
					</button>
					<button aria-label="Chọn chế độ chạy" style="display:flex; align-items:center; padding:6px 8px; background:#ffffff; border:none; cursor:pointer; color:#1a1a18;">
						<i class="ti ti-chevron-down" style="font-size:16px;" aria-hidden="true"></i>
					</button>
				</div> -->

				<!-- Filter Tags -->
				<!-- <div style="display:flex;align-items:center;">
					<span style="display:inline-block;width:32px;">Tags </span>
					<mt-tagbox id="tagInclude" style="width: calc(100% - 32px);"></mt-tagbox>
				</div> -->

			</div>

			<!-- Contain Read -->
			<div id="document-content" style="height:calc(100% - 34px);width:100%;border:0;"></div>

			<!-- Contain Edit -->
			<div id="document-edit" style="height:calc(100% - 34px);width:100%;border:0;display:none;">

				<!-- CodeMirror -->
				<textarea id="editor-md" rows="10" cols="60"></textarea>

			</div>

		</div>
	</div>

	<script src="/document/script.js" type="module"></script>
</body>
</html>
